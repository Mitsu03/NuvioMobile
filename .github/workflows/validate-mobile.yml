name: Validate Mobile

on:
  push:
    branches: [cmp-rewrite]
  pull_request:
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distribution: [full, playstore]
        include:
          - distribution: full
            variant: Full
          - distribution: playstore
            variant: Playstore
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure validation build
        run: |
          touch local.properties
          mkdir -p "${HOME}/.gradle"
          cat > "${HOME}/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
          kotlin.daemon.jvmargs=-Xmx3072M
          org.gradle.workers.max=2
          PROPERTIES
      - name: Run tests, lint and build APK
        run: >-
          ./gradlew :composeApp:testAndroidHostTest
          :androidApp:lint${{ matrix.variant }}Debug
          :androidApp:assemble${{ matrix.variant }}Debug
          -Pnuvio.android.distribution=${{ matrix.distribution }}
          -Pnuvio.ios.distribution=appstore --stacktrace
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.distribution }}-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
            androidApp/build/reports/
          if-no-files-found: ignore

  ios:
    name: iOS ${{ matrix.distribution }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        distribution: [full, appstore]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NUVIO_IOS_DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: validation-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Configure validation build
        run: |
          touch local.properties
          mkdir -p "${HOME}/.gradle"
          cat > "${HOME}/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
          kotlin.daemon.jvmargs=-Xmx2048M
          kotlin.native.jvmArgs=-Xmx4608M
          org.gradle.workers.max=2
          PROPERTIES
          ./scripts/prepare-ios-dependencies.sh
      - name: Build simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-validation-${NUVIO_IOS_DISTRIBUTION} \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run shared and iOS tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.distribution }}-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
